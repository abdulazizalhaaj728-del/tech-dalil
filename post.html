<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">تكنو-دليل | المدونة التقنية الشاملة</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Almarai:wght@400;700&family=Readex+Pro:wght@400;600&family=Changa:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0284c7;
            --accent-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--active-font, 'Cairo', sans-serif) !important;
            background-color: var(--bg-color, #0f172a);
            color: var(--text-main, #f8fafc);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
            padding: 10px;
        }

        .site-outer-frame {
            max-width: 1230px;
            width: 100%;
            margin: 0 auto;
            border: 1px solid gray;
            border-radius: 0px;
            padding: 10px;
            background: var(--bg-color);
            box-shadow: 0 0 0px rgba(0, 0, 0, 0);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        body.theme-default { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary-color: #0284c7; --accent-color: #0284c7; --border-color: #334155; }
        body.theme-blue-1 { --bg-color: #041221; --card-bg: #0c2340; --text-main: #f0f9ff; --text-muted: #7dd3fc; --primary-color: #38bdf8; --accent-color: #38bdf8; --border-color: #1d4ed8; }
        body.theme-pink { --bg-color: #12090e; --card-bg: #1f1017; --text-main: #fce8ef; --text-muted: #d4839d; --primary-color: #e04885; --accent-color: #e04885; --border-color: #5c2438; }
        body.theme-wood { --bg-color: #120e0a; --card-bg: #1f1712; --text-main: #f7ede2; --text-muted: #c29b7a; --primary-color: #b86b3a; --accent-color: #b86b3a; --border-color: #593f2b; }
        body.theme-green { --bg-color: #051911; --card-bg: #0d2e20; --text-main: #ecfdf5; --text-muted: #6ee7b7; --primary-color: #10b981; --accent-color: #10b981; --border-color: #065f46; }
        body.theme-purple { --bg-color: #130a24; --card-bg: #231442; --text-main: #f5f3ff; --text-muted: #c4b5fd; --primary-color: #8b5cf6; --accent-color: #8b5cf6; --border-color: #5b21b6; }

        .section-title {
            text-align: center;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            background-color: var(--accent-color);
            padding: 5px;
            border-radius: 6px;
        }
        
        .top-bar {
            background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 8px 20px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 0.85rem;
            width: 100%; margin: 0 auto; border-radius: 8px 8px 0 0;
        }
        .top-pages { display: flex; gap: 12px; justify-content: flex-start; }
        .top-pages a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; }
        .top-pages a:hover { color: var(--primary-color); }

        .top-controls { display: flex; align-items: center; gap: 10px; justify-content: center; }
        .control-btn {
            background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px;
        }
        .color-switcher-group {
            display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;
        }
        .color-switcher-group button { background: transparent; border: none; color: var(--text-main); padding: 5px 8px; cursor: pointer; font-size: 0.75rem; }
        .color-center-icon { padding: 0 4px; font-size: 0.8rem; color: var(--accent-color); }

        .top-social { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
        .top-social a { color: var(--text-muted); font-size: 0.9rem; text-decoration: none; transition: color 0.2s; }
        .top-social a:hover { color: var(--accent-color); }

        header {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--primary-color); padding: 10px;
            display: grid; grid-template-columns: 200px 1fr 200px; align-items: center; gap: 15px;
            width: 100%; margin: 10px auto 0; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .header-logo { display: flex; align-items: center; justify-content: flex-start; }
        .header-logo img { max-height: 100px; }
        
        .header-center { text-align: center; }
        .header-center h1 { font-size: 2.2rem; font-weight: 900; color: var(--text-main); }
        .header-center h1 span { color: var(--primary-color); }
        .header-center p { color: var(--text-muted); font-size: 0.95rem; }

        .ticker-wrapper { width: 100%; margin: 15px auto 0; padding: 0; }
        .ticker-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 15px; display: flex; align-items: center; position: relative; overflow: hidden; }
        .ticker-title { background: var(--accent-color); color: #000; padding: 5px 12px; font-size: 0.85rem; font-weight: 700; border-radius: 4px; margin-left: 15px; flex-shrink: 0; z-index: 5; position: relative; }
        .ticker-viewport { overflow: hidden; width: 100%; position: relative; height: 24px; }
        .ticker-content { display: inline-block; position: absolute; white-space: nowrap; animation: tickerSmooth 18s linear infinite; font-size: 0.9rem; color: var(--text-main); right: 0; }
        .ticker-content span { margin-left: 35px; cursor: pointer; }
        @keyframes tickerSmooth { 
            0% { transform: translateX(-100%); opacity: 1; } 
            90% { opacity: 1; }
            95% { transform: translateX(85%); opacity: 0; }
            100% { transform: translateX(100%); opacity: 0; } 
        }

        .main-menu-bar { width: 100%; margin: 10px auto 0; padding: 0; position: sticky; top: 0; z-index: 999; }
        .mega-menu { background: var(--card-bg); border: 2px solid var(--primary-color); border-radius: 10px; display: flex; flex-wrap: wrap; list-style: none; padding: 5px 10px; gap: 5px; justify-content: flex-start; }
        .mega-menu li a, .mega-menu > a { display: flex; align-items: center; gap: 6px; padding: 8px 16px; color: var(--text-main); text-decoration: none; font-weight: 700; font-size: 13px; border-radius: 6px; }
        .mega-menu li a:hover, .mega-menu > a:hover { background: rgba(2, 132, 199, 0.2); color: var(--accent-color); }
       
        .dropdown-menu {
            position: absolute; top: 100%; right: 0; min-width: 200px;
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; list-style: none; display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 99; text-align: right; padding: 5px 0;
        }
        .mega-menu > li { position: relative; }
        .mega-menu > li:hover > .dropdown-menu { display: block; }
        .dropdown-menu li { position: relative; border-bottom: 1px solid var(--border-color); }
        .dropdown-menu li:last-child { border-bottom: none; }
        .dropdown-menu li a { display: block; padding: 9px 15px; color: var(--text-main); text-decoration: none; font-size: 12.5px; font-weight: 600; transition: 0.2s; }
        .dropdown-menu li a:hover { background: rgba(2, 132, 199, 0.2); color: var(--accent-color); padding-right: 20px; }
        .dropdown-menu li:hover > .dropdown-menu { display: block; position: absolute; right: 100%; top: -5px; }

        .three-columns-grid { 
            width: 100%; margin: 20px auto 0; padding: 0; 
            display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; position: relative; 
        }
        @media (max-width: 950px) { .three-columns-grid { grid-template-columns: 1fr; } }

        .right-scrollable-section { width: 100%; }

        .post-card {
            background-color: #F7F4EF !important;
            border: 1px solid #E2D8C5 !important;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 25px;
            margin-bottom: 15px;
        }
        
        .post-card h1, .post-card h2, .post-card h3, .single-post-content {
            color: #2C3E50 !important;
        }
        
        .post-card .post-meta {
            color: #596573 !important;
        }    

        .single-post-content { font-size: 1.05rem; line-height: 1.8; margin-top: 15px; }
        .single-post-content p { margin-bottom: 15px; }
        .content img, .post-img, .featured-img, article img {
            display: block !important;
            margin: 15px auto !important;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }

        .back-to-home-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--primary-color); color: #fff; padding: 6px 14px;
            border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold;
            transition: opacity 0.2s;
        }
        .back-to-home-btn:hover { opacity: 0.85; }

        .related-posts-section { margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px; }
        .related-posts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        @media(max-width: 600px) { .related-posts-grid { grid-template-columns: 1fr; } }
        .related-card {
            background: var(--bg-color); border: 1px solid var(--border-color); padding: 12px;
            border-radius: 8px; cursor: pointer; text-decoration: none; color: var(--text-main); display: block; transition: 0.2s;
        }
        .related-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .related-card h4 { font-size: 0.9rem; color: var(--accent-color); margin-bottom: 4px; }
        .related-card p { font-size: 0.75rem; color: var(--text-muted); }

        .left-sticky-sidebar { 
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; 
            position: sticky; top: 60px; align-self: flex-start; max-height: calc(100vh - 90px); overflow-y: auto;
        }
        .left-sticky-sidebar::-webkit-scrollbar { display: none; }
        .left-sticky-sidebar { scrollbar-width: none; -ms-overflow-style: none; }

        .widget-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .widget-title { color: var(--accent-color); font-size: 1rem; margin-bottom: 8px; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; }
        .recent-posts-list { list-style: none; padding: 0; }
        .recent-posts-list li { margin-bottom: 6px; font-size: 0.85rem; }
        .recent-posts-list li a { color: var(--text-main); text-decoration: none; display: flex; align-items: center; }
        .recent-posts-list li a:hover { color: var(--accent-color); }

        .site-footer { width: 100%; margin: 15px auto 0; padding: 0; }
        .footer-container { 
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; 
            padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; 
        }
        .footer-bottom-bar { text-align: center; padding: 15px; margin-top: 15px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; background: var(--card-bg); border-radius: 8px; }
        .secret-c { cursor: pointer; display: inline-block; padding: 0 2px; font-weight: bold; }

        @media (max-width: 900px) { .footer-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .footer-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body class="theme-default">

    <div class="site-outer-frame">
        <div id="site-ad-top" style="width: 100%; margin: 10px auto; text-align: center;"></div>

        <div class="top-bar">
            <div class="top-pages">
                <a href="articles/privacy-policy.html">سياسة الخصوصية</a>
                <a href="articles/terms.html">اتفاقية الاستخدام</a>
                <a href="articles/about-us.html">من نحن</a>
                <a href="articles/contact-us.html">اتصل بنا</a>
            </div>
            
            <div class="top-controls">
                <div class="color-switcher-group">
                    <button id="prev-theme-btn" title="الثيم السابق"><i class="fa-solid fa-chevron-right"></i></button>
                    <span class="color-center-icon"><i class="fa-solid fa-palette"></i></span>
                    <button id="next-theme-btn" title="الثيم التالي"><i class="fa-solid fa-chevron-left"></i></button>
                </div>
                <button class="control-btn" id="font-toggle-btn" title="تغيير الخط"><i class="fa-solid fa-font"></i> الخط</button>
                <button class="control-btn" id="dark-mode-btn" title="الوضع الليلي"><i class="fa-solid fa-moon"></i></button>
            </div>

            <div class="top-social">
                <a href="#" title="إكس (تويتر)"><i class="fa-brands fa-x-twitter"></i></a>

        <header>

                <h1 id="site-main-heading">تكنو-<span>دليل</span></h1>
                <p id="site-tagline">بوابة الحلول الرقمية والتقنية المبتكرة</p>
            </div>
            <div></div>
        </header>

        <div class="ticker-wrapper" id="site-ticker-wrapper">
            <div class="ticker-container">
                <div class="ticker-title">إضاءة</div>
                <div class="ticker-viewport">
                    <div class="ticker-content" id="ticker-text">مرحباً بك في مدونة تكنو-دليل | تابع أحدث المقالات التقنية والشروحات البرمجية المتجددة.</div>
                </div>
            </div>
        </div>

        <div class="main-menu-bar">
            <nav id="site-main-menu" class="mega-menu">
                <li><a href="index.html">الرئيسية</a></li>
            </nav>
        </div>

        <div id="site-ad-mid" style="width: 100%; margin: 15px auto; text-align: center;"></div>
        
        <div class="three-columns-grid">
            <div class="right-scrollable-section">
                <main>
                    <article class="post-card" id="post-content-box">
                        <div style="text-align: center; padding: 40px; color: var(--text-muted);">جاري تحميل المقال...</div>
                    </article>
                </main>
            </div>

            <div class="left-sticky-sidebar">
                <div class="left-content-area" id="left-widgets-area"></div>

        <footer class="site-footer">
            <div class="footer-container" id="site-footer-widgets"></div>
            <div class="footer-bottom-bar">
                جميع الحقوق محفوظة <span class="secret-c" id="secret-trigger" title="إدارة">©</span> 2026 - <span id="footer-site-name">تكنو-دليل</span>
            </div>
        </footer>
    </div>


<script>
document.addEventListener('DOMContentLoaded', async () => {
    // استخلاص معرف المقال أو الـ Slug مباشرة من رابط الصفحة الحالية (URL) دون تدخل من أي ملف آخر
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');
    const articleParam = urlParams.get('article');
    const slugParam = urlParams.get('slug');

    let targetSlug = '';
    if (articleParam) {
        let parts = articleParam.split('/');
        let lastPart = parts[parts.length - 1];
        targetSlug = lastPart.replace(/\.html$/i, '');
    } else if (slugParam) {
        targetSlug = slugParam.replace(/\.html$/i, '');
    }

    const isInsideArticles = window.location.pathname.includes('/articles/');
    const homeLink = isInsideArticles ? '../index.html' : 'index.html';
    const container = document.getElementById('post-content-box');

    let data = null;

    // جلب ملف data.json مباشرة وحسب مساره الصحيح (سواء من داخل articles أو من الجذر)
    const jsonPath = isInsideArticles ? '../data.json?t=' + Date.now() : 'data.json?t=' + Date.now();
    
    try {
        const response = await fetch(jsonPath);
        if (response.ok) {
            data = await response.json();
        }
    } catch (err) {
        console.error("خطأ في جلب بيانات المدونة:", err);
    }

    // إذا فشل الجلب المباشر، نحاول الاحتياط عبر التخزين المحلي فقط لتفادي التوقف التام
    if (!data || !data.posts) {
        try {
            const localData = localStorage.getItem('tech_dalil_data');
            if (localData) {
                data = JSON.parse(localData);
            }
        } catch (e) {
            console.warn("التخزين المحلي غير متوفر:", e);
        }
    }

    if (data && data.posts) {
        const postsList = data.posts || [];
        let post = null;

        // مطابقة المقال المطلوب بناءً على الرابط المستخلص ذاتياً
        if (postId) {
            post = postsList.find(p => p.id == postId);
        } else if (targetSlug) {
            post = postsList.find(p => p.slug === targetSlug || (p.url && p.url.includes(targetSlug)));
        }

        if (post) {
            // تحديث عنوان الصفحة
            const siteTitleEl = document.getElementById('site-title');
            if (siteTitleEl) siteTitleEl.innerText = post.title + " | تكنو-دليل";

            let ads = data.ads || {};
            let topAd = (ads.topOn && ads.topCode) ? `<div style="margin:15px 0; text-align:center;">${ads.topCode}</div>` : '';
            let botAd = (ads.botOn && ads.botCode) ? `<div style="margin:15px 0; text-align:center;">${ads.botCode}</div>` : '';

            // المقالات ذات الصلة
            let relatedPosts = postsList.filter(p => p.id !== post.id).slice(0, 2);
            let relatedHtml = '';
            if (relatedPosts.length > 0) {
                relatedHtml = `
                    <div class="related-posts-section" style="margin-top: 30px; padding: 15px; background: rgba(0,0,0,0.02); border-radius: 8px;">
                        <h3 style="font-size: 1rem; color: var(--accent-color); margin-bottom: 10px;">📌 مواضيع ذات صلة:</h3>
                        <div class="related-posts-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            ${relatedPosts.map(rp => `
                                <a href="post.html?article=articles/${rp.slug}.html" class="related-card" style="text-decoration: none; color: inherit; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; display: block;">
                                    <h4 style="font-size: 0.9rem; margin-bottom: 5px;">${rp.title}</h4>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // عرض محتوى المقال بكل استقلالية
            if (container) {
                container.innerHTML = `
                    <div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
                        <a href="${homeLink}" class="back-to-home-btn"><i class="fa-solid fa-arrow-right"></i> العودة إلى الرئيسية</a>
                    </div>
                    <h1 style="font-size: 1.8rem; font-weight: 700; color: var(--accent-color); margin-bottom: 10px; line-height: 1.4;">${post.title}</h1>
                    <div class="post-meta" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">
                        <span>📅 ${post.date || 'حديث'}</span> | <span>📁 ${post.category || 'عام'}</span> | <span>✍️ ${post.author || 'إدارة المدونة'}</span>
                    </div>
                    ${topAd}
                    <div class="single-post-content" style="line-height: 1.8;">
                        ${post.content || post.description || ''}
                    </div>
                    ${botAd}
                    ${relatedHtml}
                    <div style="margin-top: 25px; display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 15px;">
                        <a href="${homeLink}" class="back-to-home-btn"><i class="fa-solid fa-arrow-right"></i> العودة إلى الرئيسية</a>
                    </div>
                `;
            }
        } else {
            if (container) {
                container.innerHTML = `
                    عذراً، المقال المطلوب غير موجود في قاعدة البيانات أو أن الرابط غير صحيح.
                    <br><br><a href="${homeLink}" class="back-to-home-btn">العودة للرئيسية</a>
                `;
            }
        }

        // بناء القوائم والودجتس الخاصة بملف المقال نفسه بشكل ذاتي
        if (data.menu && data.menu.length > 0) {
            const menuContainer = document.getElementById('site-main-menu');
            if (menuContainer) {
                // توليد القائمة مباشرة دون تدخل الـ index
                let menuHtml = '';
                data.menu.forEach(item => {
                    let itemUrl = item.url || item.link || 'index.html';
                    if (isInsideArticles && !itemUrl.startsWith('http') && !itemUrl.startsWith('../')) {
                        itemUrl = '../' + itemUrl;
                    }
                    menuHtml += `<li><a href="${itemUrl}">${item.title}</a></li>`;
                });
                menuContainer.innerHTML = menuHtml;
            }
        }

    } else {
        if (container) {
            container.innerHTML = `تعذر تحميل بيانات المدونة. تأكد من سلامة ملف data.json. <br><br><a href="${homeLink}">العودة للرئيسية</a>`;
        }
    }

    // إعدادات السمات والألوان والخطوط (تعمل محلياً لكل صفحة بصورة مستقلة)
    const fontsList = ["'Cairo', sans-serif", "'Tajawal', sans-serif", "'Almarai', sans-serif", "'Readex Pro', sans-serif"];
    let currentFontIdx = localStorage.getItem('tech_font_idx') ? parseInt(localStorage.getItem('tech_font_idx')) : 0;
    document.documentElement.style.setProperty('--active-font', fontsList[currentFontIdx]);

    const themesList = ['theme-default', 'theme-blue-1', 'theme-pink', 'theme-wood', 'theme-green', 'theme-purple'];
    let currentThemeIdx = localStorage.getItem('tech_theme_idx') ? parseInt(localStorage.getItem('tech_theme_idx')) : 0;
    document.body.classList.add(themesList[currentThemeIdx]);

    if(localStorage.getItem('tech_light_mode') === '1') {
        document.body.classList.add('light-mode');
    }
});
</script>
</body>
</html>
