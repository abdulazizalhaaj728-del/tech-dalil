<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | تكنو-دليل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0284c7; --accent-color: #f59e0b;
            --bg-dark: #0f172a; --card-bg: #1e293b;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; }
        .admin-container { max-width: 950px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--accent-color); margin-bottom: 20px; border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; }
        h3 { color: var(--primary-color); margin-bottom: 12px; font-size: 1.1rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        input, textarea, select { width: 100%; padding: 10px; background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; font-size: 0.95rem; }
        textarea { height: 110px; resize: vertical; }
        .btn { background: var(--primary-color); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 700; }
        .section-box { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: normal; }
        .checkbox-label input { width: auto; }
        
        .sticky-editor-header {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 8px; padding: 10px 15px; margin-bottom: 10px;
        }
        .custom-font-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .font-tag-btn { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
        .ql-container.ql-snow { background: var(--bg-dark); color: var(--text-main); border-color: var(--border-color); min-height: 250px; }
    </style>
</head>
<body>

    <div class="admin-container">
        <a href="#" style="color: var(--primary-color); text-decoration: none; font-weight: bold; display:inline-block; margin-bottom:15px;">← العودة للموقع الرئيسي</a>
        <h2>لوحة التحكم الشاملة (تصميم هيكلي خالٍ من الحفظ)</h2>

        <div class="section-box" style="border-color: #38bdf8;">
            <h3 style="color: #38bdf8;"><i class="fa-brands fa-github"></i> إعدادات الربط السحابي</h3>
            <input type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx" style="direction: ltr;" disabled>
        </div>

        <div class="section-box">
            <h3>🖼️ إدارة شعار المدونة وأحجامه</h3>
            <input type="file" style="margin-bottom:10px;" disabled>
        </div>

        <div class="section-box">
            <h3>📢 إعدادات الشريط المتحرك</h3>
            <div class="form-group">
                <label class="checkbox-label"><input type="checkbox"> إظهار الشريط المتحرك في الصفحة الرئيسية</label>
            </div>
        </div>

        <div class="section-box">
            <h3 style="color: var(--accent-color);">📋 نظام القوائم الذكي الهرمي</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <input type="text" placeholder="_تقنية أو __أول شرح" style="flex: 2;">
                <input type="text" placeholder="الرابط" style="flex: 2;">
                <button type="button" class="btn">إضافة للقائمة</button>
            </div>
        </div>

        <div class="section-box">
            <h3>📝 إدارة ونشر المقالات والصفحات</h3>
            <div class="form-group">
                <label>العنوان:</label>
                <input type="text" placeholder="عنوان المقال أو الصفحة">
            </div>
            
            <div class="form-group">
                <label>المحتوى:</label>
                <div class="sticky-editor-header">
                    <div class="custom-font-bar">
                        <button type="button" class="font-tag-btn">خط كايرو</button>
                        <button type="button" class="font-tag-btn">خط تجوال</button>
                    </div>
                </div>
                <div id="editor-container"></div>
            </div>
            <button class="btn" disabled>حفظ ونشر (معطل)</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
    <script>
        // تم إزالة كافة وظائف الحفظ والاسترجاع والربط بـ API والـ LocalStorage بناءً على رغبتك.
    </script>
</body>
</html>
