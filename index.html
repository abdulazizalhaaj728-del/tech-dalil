<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">تكنو-دليل | المدونة التقنية الشاملة</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&family=Almarai:wght@400;700&family=Readex+Pro:wght@400;600&family=Changa:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0284c7;
            --accent-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--active-font, 'Cairo', sans-serif) !important;
            background-color: var(--bg-color, #0f172a);
            color: var(--text-main, #f8fafc);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, color 0.3s;
            padding: 10px;
        }

        .site-outer-frame {
            max-width: 1230px;
            width: 100%;
            margin: 0 auto;
            border: 1px solid gray;
            border-radius: 0px;
            padding: 10px;
            background: var(--bg-color);
            box-shadow: 0 0 0px rgba(0, 0, 0, 0);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        body.theme-default { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary-color: #0284c7; --accent-color: #0284c7; --border-color: #334155; }
        body.theme-blue-1 { --bg-color: #041221; --card-bg: #0c2340; --text-main: #f0f9ff; --text-muted: #7dd3fc; --primary-color: #38bdf8; --accent-color: #38bdf8; --border-color: #1d4ed8; }
        body.theme-pink { --bg-color: #12090e; --card-bg: #1f1017; --text-main: #fce8ef; --text-muted: #d4839d; --primary-color: #e04885; --accent-color: #e04885; --border-color: #5c2438; }
        body.theme-wood { --bg-color: #120e0a; --card-bg: #1f1712; --text-main: #f7ede2; --text-muted: #c29b7a; --primary-color: #b86b3a; --accent-color: #b86b3a; --border-color: #593f2b; }
        body.theme-green { --bg-color: #051911; --card-bg: #0d2e20; --text-main: #ecfdf5; --text-muted: #6ee7b7; --primary-color: #10b981; --accent-color: #10b981; --border-color: #065f46; }
        body.theme-purple { --bg-color: #130a24; --card-bg: #231442; --text-main: #f5f3ff; --text-muted: #c4b5fd; --primary-color: #8b5cf6; --accent-color: #8b5cf6; --border-color: #5b21b6; }

        .section-title {
            text-align: center;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 8px;
            background-color: var(--accent-color);
            padding: 5px;
            border-radius: 6px;
        }
        
        .top-bar {
            background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 8px 20px;
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 0.85rem;
            width: 100%; margin: 0 auto; border-radius: 8px 8px 0 0;
        }
        .top-pages { display: flex; gap: 12px; justify-content: flex-start; }
        .top-pages a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; }
        .top-pages a:hover { color: var(--primary-color); }

        .top-controls { display: flex; align-items: center; gap: 10px; justify-content: center; }
        .control-btn {
            background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; gap: 5px;
        }
        .color-switcher-group {
            display: flex; align-items: center; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden;
        }
        .color-switcher-group button { background: transparent; border: none; color: var(--text-main); padding: 5px 8px; cursor: pointer; font-size: 0.75rem; }
        .color-center-icon { padding: 0 4px; font-size: 0.8rem; color: var(--accent-color); }

        .top-social { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
        .top-social a { color: var(--text-muted); font-size: 0.9rem; text-decoration: none; transition: color 0.2s; }
        .top-social a:hover { color: var(--accent-color); }

        header {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--bg-color) 100%);
            border-bottom: 2px solid var(--primary-color); padding: 10px;
            display: grid; grid-template-columns: 200px 1fr 200px; align-items: center; gap: 15px;
            width: 100%; margin: 10px auto 0; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .header-logo { display: flex; align-items: center; justify-content: flex-start; }
        .header-logo img { max-height: 100px; }
        
        .header-center { text-align: center; }
        .header-center h1 { font-size: 2.2rem; font-weight: 900; color: var(--text-main); }
        .header-center h1 span { color: var(--primary-color); }
        .header-center p { color: var(--text-muted); font-size: 0.95rem; }

        .ticker-wrapper { width: 100%; margin: 15px auto 0; padding: 0; }
        .ticker-container { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 15px; display: flex; align-items: center; position: relative; overflow: hidden; }
        .ticker-title { background: var(--accent-color); color: #000; padding: 5px 12px; font-size: 0.85rem; font-weight: 700; border-radius: 4px; margin-left: 15px; flex-shrink: 0; z-index: 5; position: relative; }
        .ticker-viewport { overflow: hidden; width: 100%; position: relative; height: 24px; }
        .ticker-content { display: inline-block; position: absolute; white-space: nowrap; animation: tickerSmooth 18s linear infinite; font-size: 0.9rem; color: var(--text-main); right: 0; }
        .ticker-content span { margin-left: 35px; cursor: pointer; }
        @keyframes tickerSmooth { 
            0% { transform: translateX(-100%); opacity: 1; } 
            90% { opacity: 1; }
            95% { transform: translateX(85%); opacity: 0; }
            100% { transform: translateX(100%); opacity: 0; } 
        }

        .main-menu-bar { width: 100%; margin: 10px auto 0; padding: 0; position: sticky; top: 0; z-index: 999; }
        .mega-menu { background: var(--card-bg); border: 2px solid var(--primary-color); border-radius: 10px; display: flex; flex-wrap: wrap; list-style: none; padding: 5px 10px; gap: 5px; justify-content: flex-start; }
        .mega-menu li a, .mega-menu > a { display: flex; align-items: center; gap: 6px; padding: 8px 16px; color: var(--text-main); text-decoration: none; font-weight: 700; font-size: 13px; border-radius: 6px; }
        .mega-menu li a:hover, .mega-menu > a:hover { background: rgba(2, 132, 199, 0.2); color: var(--accent-color); }
       
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            min-width: 200px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            list-style: none;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 99;
            text-align: right;
            padding: 5px 0;
        }

        .mega-menu > li { position: relative; }
        .mega-menu > li:hover > .dropdown-menu { display: block; }
        .dropdown-menu li { position: relative; border-bottom: 1px solid var(--border-color); }
        .dropdown-menu li:last-child { border-bottom: none; }
        .dropdown-menu li a { display: block; padding: 9px 15px; color: var(--text-main); text-decoration: none; font-size: 12.5px; font-weight: 600; transition: 0.2s; }
        .dropdown-menu li a:hover { background: rgba(2, 132, 199, 0.2); color: var(--accent-color); padding-right: 20px; }
        .dropdown-menu li:hover > .dropdown-menu { display: block; position: absolute; right: 100%; top: -5px; }
        
        .three-columns-grid { 
            width: 100%; margin: 20px auto 0; padding: 0; 
            display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; position: relative; 
        }
        @media (max-width: 950px) { .three-columns-grid { grid-template-columns: 1fr; } }

        .right-scrollable-section { width: 100%; }
        .top-right-row { display: flex; gap: 15px; align-items: stretch; margin-bottom: 15px; }
        @media(max-width: 768px) { .top-right-row { flex-direction: column; } }

        .square-slider-box {
            flex: 1.6;
            height: 310px;
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .square-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
        .square-slide.active { opacity: 1; }
        .square-caption { background: linear-gradient(to top, rgba(15,23,42,0.95), transparent); width: 100%; padding: 15px; z-index: 2; }
        .square-title { font-size: 1.05rem; color: var(--accent-color); font-weight: 700; margin-bottom: 5px; cursor: pointer; }
        .square-desc { font-size: 0.75rem; color: #cbd5e1; }

        .slider-arrow {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.6); color: #fff; border: none;
            width: 35px; height: 35px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 0.9rem;
        }
        .slider-arrow:hover { background: var(--primary-color); }
        .slider-prev { right: 10px; }
        .slider-next { left: 10px; }

        .news-mini-container { 
            flex: 1;
            background: var(--card-bg); 
            border: 2px dashed var(--border-color); 
            border-radius: 12px; 
            height: 310px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            color: var(--text-muted); 
            font-size: 0.9rem; 
            box-sizing: border-box;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            flex: 1;
            min-height: 0;
        }
        
        .product-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .product-card:not(.empty):hover {
            background-color: var(--card-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .product-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            box-sizing: border-box;
            gap: 4px;
        }
        
        .ad-game-thumb {
            width: 100%;
            height: 78px;
            object-fit: cover;
            border-radius: 4px;
        }
        
        .product-card span {
            color: #ffffff;
            font-size: 0.72rem;
            text-align: center;
            line-height: 1.2;
        }
        
        .product-card.empty { opacity: 0.4; cursor: default; }

        .left-sticky-sidebar { 
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; 
            position: sticky; top: 60px; align-self: flex-start; max-height: calc(100vh - 90px); overflow-y: auto;
            scrollbar-width: none; -ms-overflow-style: none;
        }
        .left-sticky-sidebar::-webkit-scrollbar { display: none; }

        .tags-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .tag-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 15px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        .tag-btn.active, .tag-btn:hover { background: var(--primary-color); color: #fff; }

        .post-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .post-title a { font-size: 1.15rem; font-weight: 700; color: var(--accent-color); text-decoration: none; }
        .post-meta { font-size: 0.8rem; color: var(--text-muted); margin: 8px 0; display: flex; gap: 15px; }
        .post-excerpt { font-size: 0.9rem; color: var(--text-main); line-height: 1.6; margin-bottom: 10px; }
        
        .single-post-content { font-size: 1.05rem; color: var(--text-main); line-height: 1.8; margin-top: 15px; }
        .single-post-content p { margin-bottom: 15px; }

        .widget-card { background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .widget-title { color: var(--accent-color); font-size: 1rem; margin-bottom: 8px; border-bottom: 1px dashed var(--border-color); padding-bottom: 5px; }
        .recent-posts-list { list-style: none; padding: 0; }
        .recent-posts-list li { margin-bottom: 6px; font-size: 0.85rem; }
        .recent-posts-list li a { color: var(--text-main); text-decoration: none; display: flex; align-items: center; }
        .recent-posts-list li a:hover { color: var(--accent-color); }

        .site-footer { width: 100%; margin: 15px auto 0; padding: 0; }
        .footer-container { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 15px; 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
        }
        .footer-bottom-bar { text-align: center; padding: 15px; margin-top: 15px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.85rem; background: var(--card-bg); border-radius: 8px; }
        .secret-c { cursor: pointer; display: inline-block; padding: 0 2px; font-weight: bold; }

        @media (max-width: 900px) { .footer-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .footer-container { grid-template-columns: 1fr; } }
    </style>
</head>

<script>
document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('posts-container');
        const sliderWrapper = document.getElementById('square-slider-wrapper');
        const recentList = document.getElementById('sidebar-recent-list');

        try {
            const response = await fetch('data.json?t=' + Date.now());
            
            if (!response.ok) {
                throw new Error(`خطأ في الاتصال بملف البيانات (رمز الاستجابة: ${response.status})`);
            }

            const jsonData = await response.json();

            // دعم مرن للشكلين: سواء كان الـ JSON مصفوفة مباشرة [...] أو كائن بداخله { posts: [...] }
            const posts = Array.isArray(jsonData) ? jsonData : (jsonData.posts || []);

            if (posts.length === 0) {
                if (container) container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted);">ملف البيانات (`data.json`) فارغ أو لا يحتوي على مقالات.</p>';
                return;
            }

            // 1. عرض المقالات الأساسية في الصفحة الرئيسية
            container.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="post-title"><a href="index.html?id=${post.id}">${post.title}</a></div>
                    <div class="post-meta"><span>📅 ${post.date || ''}</span> | <span>📁 ${post.category || 'عام'}</span></div>
                    <div class="post-excerpt">${post.description || ''}</div>
                    <a href="index.html?id=${post.id}" style="color: var(--accent-color); font-weight: bold; text-decoration: none; font-size: 0.85rem;">للقراءة أكثر ←</a>
                </div>
            `).join('');

            // 2. إعداد السلايدر (يأخذ أول 4 مقالات كحد أقصى)
            if (sliderWrapper) {
                const sliderPosts = posts.slice(0, 4);
                let sliderHtml = sliderPosts.map((p, idx) => `
                    <div class="square-slide ${idx === 0 ? 'active' : ''}" style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.75)), url('${p.image || ''}');">
                        <div class="square-caption">
                            <div class="square-title" onclick="location.href='index.html?id=${p.id}'">${p.title}</div>
                            <div class="square-desc">${p.description ? p.description.substring(0, 75) + '...' : ''}</div>
                        </div>
                    </div>
                `).join('');
                
                sliderHtml += `
                    <button class="slider-arrow slider-prev" id="slider-prev-btn"><i class="fa-solid fa-chevron-right"></i></button>
                    <button class="slider-arrow slider-next" id="slider-next-btn"><i class="fa-solid fa-chevron-left"></i></button>
                `;
                sliderWrapper.innerHTML = sliderHtml;
                initSliderLogic();
            }

            // 3. قائمة المقالات الأخيرة في الشريط الجانبي
            if (recentList) {
                recentList.innerHTML = posts.map(p => `
                    <li>
                        <a href="index.html?id=${p.id}">
                            <i class="fa-solid fa-angle-left" style="margin-left: 5px; color: var(--primary-color);"></i>${p.title}
                        </a>
                    </li>
                `).join('');
            }

        } catch (error) {
            console.error("فشل تحميل البيانات:", error);
            if (container) {
                container.innerHTML = `<div style="background:var(--card-bg); border:1px solid #ef4444; padding:15px; border-radius:8px; text-align:center; color:#ef4444;">
                    تعذر معالجة ملف البيانات.<br>
                    <small style="color:var(--text-muted); direction: ltr; display: block; margin-top: 5px;">${error.message}</small>
                </div>`;
            }
        }
    });


    
                        function generateMenuHtml(nodes, isRoot = false) {
                            let html = isRoot ? '' : '<ul class="dropdown-menu">';
                            nodes.forEach(node => {
                                let itemUrl = node.url || node.link || 'index.html';
                                let hasChildren = node.children && node.children.length > 0;
                                let arrow = isRoot && hasChildren ? ' ▾' : (hasChildren ? ' ‹' : '');
                                html += `<li><a href="${itemUrl}">${node.title}${arrow}</a>`;
                                if (hasChildren) {
                                    html += generateMenuHtml(node.children, false);
                                }
                                html += `</li>`;
                            });
                            if (!isRoot) html += '</ul>';
                            return html;
                        }

                        let menuTree = buildTree(data.menu);
                        menuContainer.innerHTML = generateMenuHtml(menuTree, true);
                    }
                }                

                if (data.widgets && data.widgets.length > 0) {
                    const sidebarWidgetsContainer = document.getElementById('left-widgets-area');
                    const footerWidgetsContainer = document.getElementById('site-footer-widgets');
                    
                    let sidebarHtml = '';
                    let footerHtml = '';

                    data.widgets.forEach(w => {
                        if (!w.active) return;
                        let contentBox = '';
                        if (w.type === 'recent') {
                            contentBox = '<ul class="recent-posts-list">' + (data.posts || []).map(p => `<li><a href="${p.url || ('index.html?id=' + p.id)}"><i class="fa-solid fa-angle-left" style="margin-left: 5px; color: var(--primary-color);"></i>${p.title}</a></li>`).join('') + '</ul>';
                        } else if (w.type === 'links') {
                            contentBox = '<div class="quick-links-box">' + (w.content || '') + '</div>';
                        } else {
                            contentBox = '<div>' + (w.content || '') + '</div>';
                        }

                        let widgetBlock = `
                            <div class="widget-card" id="${w.id}">
                                <h3 class="widget-title">${w.title}</h3>
                                <div class="widget-content">${contentBox}</div>
                            </div>
                        `;

                        if (w.location === 'footer') {
                            footerHtml += widgetBlock;
                        } else {
                            sidebarHtml += widgetBlock;
                        }
                    });

                    if (sidebarWidgetsContainer) sidebarWidgetsContainer.innerHTML = sidebarHtml;
                    if (footerWidgetsContainer) footerWidgetsContainer.innerHTML = footerHtml;
                }

                if (data.ads) {
                    if (data.ads.topOn && data.ads.topCode) {
                        const topAdBox = document.getElementById('site-ad-top');
                        if (topAdBox) topAdBox.innerHTML = data.ads.topCode;
                    }
                    if (data.ads.midOn && data.ads.midCode) {
                        const midAdBox = document.getElementById('site-ad-mid');
                        if (midAdBox) midAdBox.innerHTML = data.ads.midCode;
                    }
                    if (data.ads.botOn && data.ads.botCode) {
                        const botAdBox = document.getElementById('site-ad-bot');
                        if (botAdBox) botAdBox.innerHTML = data.ads.botCode;
                    }
                }

            } catch (err) {
                console.error("تعذر جلب ملف بيانات المدونة:", err);
            }
        });

function initSliderLogic() {
        const slides = document.querySelectorAll('.square-slide');
        if(slides.length === 0) return;
        let currentSlide = 0;
        let sliderTimer = setInterval(nextSlide, 4000);

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            slides[index].classList.add('active');
        }
        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }
        function prevSlide() {
            currentSlide = (currentSlide - 1 + slides.length) % slides.length;
            showSlide(currentSlide);
        }

        document.getElementById('slider-next-btn')?.addEventListener('click', () => {
            clearInterval(sliderTimer);
            nextSlide();
            sliderTimer = setInterval(nextSlide, 4000);
        });
        document.getElementById('slider-prev-btn')?.addEventListener('click', () => {
            clearInterval(sliderTimer);
            prevSlide();
            sliderTimer = setInterval(nextSlide, 4000);
        });
    }
    document.getElementById('secret-trigger')?.addEventListener('click', () => {
        if (prompt("كلمة المرور:") === "aziz728") window.location.href = "dashboard.html";
    });

    
        const fontsList = ["'Cairo', sans-serif", "'Tajawal', sans-serif", "'Almarai', sans-serif", "'Readex Pro', sans-serif", "'Changa', sans-serif", "'Amiri', serif"];
        let currentFontIdx = localStorage.getItem('tech_font_idx') ? parseInt(localStorage.getItem('tech_font_idx')) : 0;
        
        const fontToggleBtn = document.getElementById('font-toggle-btn');
        if(fontToggleBtn) {
            fontToggleBtn.addEventListener('click', () => {
                currentFontIdx = (currentFontIdx + 1) % fontsList.length;
                document.documentElement.style.setProperty('--active-font', fontsList[currentFontIdx]);
                localStorage.setItem('tech_font_idx', currentFontIdx);
            });
        }
        document.documentElement.style.setProperty('--active-font', fontsList[currentFontIdx]);

        const themesList = ['theme-default', 'theme-blue-1', 'theme-pink', 'theme-wood', 'theme-green', 'theme-purple'];
        let currentThemeIdx = localStorage.getItem('tech_theme_idx') ? parseInt(localStorage.getItem('tech_theme_idx')) : 0;

        function applyTheme(idx) {
            document.body.classList.remove('light-mode');
            themesList.forEach(t => document.body.classList.remove(t));
            document.body.classList.add(themesList[idx]);
            localStorage.setItem('tech_theme_idx', idx);
        }

        const nextThemeBtn = document.getElementById('next-theme-btn');
        const prevThemeBtn = document.getElementById('prev-theme-btn');

        if(nextThemeBtn) {
            nextThemeBtn.addEventListener('click', () => {
                currentThemeIdx = (currentThemeIdx + 1) % themesList.length;
                applyTheme(currentThemeIdx);
            });
        }
        if(prevThemeBtn) {
            prevThemeBtn.addEventListener('click', () => {
                currentThemeIdx = (currentThemeIdx - 1 + themesList.length) % themesList.length;
                applyTheme(currentThemeIdx);
            });
        }
        applyTheme(currentThemeIdx);

        const darkModeBtn = document.getElementById('dark-mode-btn');
        if(darkModeBtn) {
            darkModeBtn.addEventListener('click', () => {
                document.body.classList.toggle('light-mode');
                const isLight = document.body.classList.contains('light-mode');
                localStorage.setItem('tech_light_mode', isLight ? '1' : '0');
                darkModeBtn.innerHTML = isLight ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
            });

            if(localStorage.getItem('tech_light_mode') === '1') {
                document.body.classList.add('light-mode');
                darkModeBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            }
        }

        const secretTrigger = document.getElementById('secret-trigger');
        if(secretTrigger) {
            secretTrigger.addEventListener('click', () => {
                const pass = prompt("كلمة المرور للوصول إلى لوحة التحكم:");
                if(pass === "aziz728") {
                    window.location.href = "dashboard.html";
                } else if(pass !== null) {
                    alert("كلمة المرور غير صحيحة!");
                }
            });
        }
    </script>
