collections:
  - name: "blog"
    label: "المقالات التقنية"
    folder: "src/content/blog"
    create: true
    # هذا السطر يضمن أن اسم الملف نفسه سيكون فريداً ومرتباً زمنياً
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}" 
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      # حقل اختياري يظهر للكاتب، إن ملأه نأخذه، وإن تركه فارغاً لا يسبب مشكلة!
      - { label: "رابط مخصص للمقالة (Slug)", name: "slug", widget: "string", required: false, hint: "اختياري: اكتب رابطاً بالإنجليزية. إذا تركته فارغاً، سيتكفل النظام بتوليده لك." }
      
      - {label: "الوصف المختصر", name: "description", widget: "text"}
      - {label: "الصورة البارزة", name: "image", widget: "image", required: false}
      - { label: "المحتوى", name: "body", widget: "markdown" }

      

  - name: "pages"
    label: "الصفحات الثابتة (سياسة الخصوصية وغيرها)"
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "عنوان الصفحة", name: "title", widget: "string"}
      - {label: "محتوى الصفحة", name: "body", widget: "markdown"}
